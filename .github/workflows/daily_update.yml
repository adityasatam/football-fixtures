name: Daily Football Fixture Update

on:
  schedule:
    # 05:30 AM IST every day
    # 00:00 UTC = 05:30 IST
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-fixture-update
  cancel-in-progress: false

jobs:
  update-fixtures:

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------
      # Run OpenFoot fixture sync
      # -------------------------------------------------------

      - name: Update football fixtures
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          python -m src.main

      # -------------------------------------------------------
      # Commit updated CSV files
      # -------------------------------------------------------

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football_fixtures_2026_27.csv
          git add data/instagram_fixtures.csv

          if git diff --cached --quiet; then
            echo "No fixture changes detected."
          else
            git commit -m "Update football fixtures"
            git push
          fi
