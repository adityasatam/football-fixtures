name: Daily Football Fixture Update

on:
  schedule:
    # 05:30 AM IST
    - cron: "0 0 * * *"

    # 11:30 AM IST
    - cron: "0 6 * * *"

    # 05:30 PM IST
    - cron: "0 12 * * *"

    # 11:30 PM IST
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-fixture-update
  cancel-in-progress: false

jobs:
  update-fixtures:

    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------
      # Run OpenFoot fixture sync
      # -------------------------------------------------------

      - name: Update football fixtures
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          python -m src.main

      # -------------------------------------------------------
      # Generate Instagram prompts
      # -------------------------------------------------------

      - name: Generate Instagram prompts
        run: |
          python main.py

      # -------------------------------------------------------
      # Commit updated data and prompts
      # -------------------------------------------------------

      - name: Commit updated data and prompts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/football_fixtures_2026_27.csv
          git add data/instagram_fixtures.csv
          git add prompt_ref.txt
          git add prompts/

          if git diff --cached --quiet; then
            echo "No fixture or prompt changes detected."
          else
            git commit -m "Update football fixtures and Instagram prompts"

            # Sync with the latest remote main branch
            # before pushing to avoid non-fast-forward errors.
            git pull --rebase origin main

            git push origin main
          fi
