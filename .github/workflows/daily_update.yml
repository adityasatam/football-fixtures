name: Update football fixtures

on:
  schedule:
    # 03:30 UTC = 09:00 IST
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update fixtures
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python -m src.main

      - name: Commit updated fixture file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_fixtures_2026_27.csv
          if git diff --cached --quiet; then
            echo "No fixture changes detected."
          else
            git commit -m "chore: update football fixtures"
            git push
          fi
